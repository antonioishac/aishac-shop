spring.application.name=config-server
server.port=8888

# Backend padrão: native (local), lê config-repo/ do disco (montado no container em /config-repo).
# Em dev/prod, ative o perfil git (application-git.properties).
spring.profiles.default=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPO_LOCATION:file:../../config-repo/}

spring.threads.virtual.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
