# Backend Git (dev/prod): lê config-repo/ deste repositório no GitHub, na branch main.
# Ative com SPRING_PROFILES_ACTIVE=git. O repositório é público; se virar privado, use credenciais via ${VAR}.
spring.cloud.config.server.git.uri=${CONFIG_GIT_URI:https://github.com/antonioishac/aishac-shop.git}
spring.cloud.config.server.git.search-paths=config-repo
spring.cloud.config.server.git.default-label=${CONFIG_GIT_LABEL:main}
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.timeout=10
