description: Sem addressId, devolve o cliente com o endereço padrão como endereço de entrega.
name: shouldReturnOrderDataWithDefaultAddress
# Mesma URL dos contratos com addressId (prioridade 1): no stub, estes vencem quando o parâmetro vem.
# Não dá para usar o matcher "absent" em YAML: o teste gerado envia addressId=null (400).
priority: 2
request:
  method: GET
  url: /api/v1/customers/0192f0c4-7d1e-7a3b-9c2d-4e5f6a7b8c9d/order-data
response:
  status: 200
  headers:
    Content-Type: application/json
    X-Correlation-Id: 3f1c2b9e-5d4a-4e7f-9a1b-2c3d4e5f6a7b
  body:
    customerId: 0192f0c4-7d1e-7a3b-9c2d-4e5f6a7b8c9d
    fullName: Ana Souza
    email: ana@example.com
    status: ACTIVE
    shippingAddress:
      id: 0192f0c5-1a2b-7c3d-8e4f-5a6b7c8d9e0f
      label: Casa
      zipCode: "01310100"
      street: Avenida Paulista
      number: "1000"
      complement: Apto 42
      district: Bela Vista
      city: São Paulo
      state: SP
      country: BR
      isDefault: true
  matchers:
    headers:
      - key: Content-Type
        regex: "application/json.*"
      - key: X-Correlation-Id
        regex: "[A-Za-z0-9-]{1,64}"
