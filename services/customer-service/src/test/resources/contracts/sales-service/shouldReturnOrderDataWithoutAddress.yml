description: Cliente sem addressId e sem endereço padrão recebe shippingAddress nulo (quem recusa é o sales-service).
name: shouldReturnOrderDataWithoutAddress
request:
  method: GET
  url: /api/v1/customers/0192f0c4-8e2f-7b4c-8d3e-5f6a7b8c9d0e/order-data
response:
  status: 200
  headers:
    Content-Type: application/json
    X-Correlation-Id: 3f1c2b9e-5d4a-4e7f-9a1b-2c3d4e5f6a7b
  body:
    customerId: 0192f0c4-8e2f-7b4c-8d3e-5f6a7b8c9d0e
    fullName: Bruno Lima
    email: bruno@example.com
    status: ACTIVE
    shippingAddress: null
  matchers:
    headers:
      - key: Content-Type
        regex: "application/json.*"
      - key: X-Correlation-Id
        regex: "[A-Za-z0-9-]{1,64}"
