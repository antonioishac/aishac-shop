name: config-server

on:
  push:
    branches: [main]
    paths:
      - services/config-server/**
      - config-repo/**
      - .github/workflows/config-server.yml
      - .github/workflows/_java-service.yml
  pull_request:
    paths:
      - services/config-server/**
      - config-repo/**
      - .github/workflows/config-server.yml
      - .github/workflows/_java-service.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/_java-service.yml
    with:
      service: config-server
