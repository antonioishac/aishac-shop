# Workflow reutilizável: build completo de um serviço Java (./mvnw verify).
# Inclui Spotless check, testes unitários, *IT com Testcontainers, ArchUnit e cobertura mínima (JaCoCo).
name: java-service

on:
  workflow_call:
    inputs:
      service:
        description: Pasta do serviço em services/
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ inputs.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/${{ inputs.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/${{ inputs.service }}/pom.xml

      - name: Build, testes e gates de qualidade
        run: ./mvnw -B -ntp verify

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.service }}-coverage
          path: services/${{ inputs.service }}/target/site/jacoco/
          if-no-files-found: ignore

      - name: Relatórios de teste (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.service }}-test-reports
          path: |
            services/${{ inputs.service }}/target/surefire-reports/
            services/${{ inputs.service }}/target/failsafe-reports/
          if-no-files-found: ignore
