server.port=8081

spring.datasource.username=${DB_USERNAME:customer_app}
spring.datasource.password=${DB_PASSWORD}

# Sem banco o serviço não atende nada: readiness cai junto (spec F01-020, seção 7).
management.endpoint.health.group.readiness.include=readinessState,db

# Máscara de CPF e e-mail em todo log JSON.
logging.structured.json.customizer=com.aishac.customer.config.SensitiveDataMaskingCustomizer
