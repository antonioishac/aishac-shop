server.port=8082

spring.datasource.username=${DB_USERNAME:sales_app}
spring.datasource.password=${DB_PASSWORD}

# Máscara de CPF e e-mail em todo log JSON.
logging.structured.json.customizer=com.aishac.sales.config.SensitiveDataMaskingCustomizer

# Catálogo: imagens de produto (F01-035/036, rule storage). Valores que variam por perfil nos arquivos -<perfil>.
aishac.storage.presigned-url-ttl=15m
aishac.storage.max-file-size=5MB
aishac.storage.max-images-per-product=8
# Acima do limite da aplicação, para ela responder IMAGE_TOO_LARGE em vez de o servlet recusar antes.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Acima do multipart, responde 400 FILE_TOO_LARGE. O Tomcat descarta até 20 MB do corpo não lido para conseguir
# entregar essa resposta; acima disso fecha a conexão.
server.tomcat.max-swallow-size=20MB

# Circuit Breaker do S3 (ADR-009). Retry e timeouts ficam com o próprio AWS SDK.
resilience4j.circuitbreaker.instances.s3.sliding-window-size=20
resilience4j.circuitbreaker.instances.s3.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.s3.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.s3.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.s3.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.s3.slow-call-duration-threshold=3s
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
