spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/aishac_sales
spring.datasource.hikari.maximum-pool-size=5

# Dados de exemplo só no local (db/seed, F01-031).
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# LocalStack (ADR-011): endpoint local e path-style; credenciais fictícias vêm do ambiente (AWS_ACCESS_KEY_ID=test).
aishac.storage.bucket=${PRODUCT_IMAGES_BUCKET:aishac-product-images-local}
aishac.storage.region=${AWS_REGION:us-east-1}
aishac.storage.endpoint=${AWS_S3_ENDPOINT:http://localhost:4566}
aishac.storage.path-style-access=true
# Endpoint das URLs pré-assinadas: o navegador acessa localhost:4566 mesmo quando o serviço roda no Docker (ADR-010).
aishac.storage.public-endpoint=${AWS_S3_PUBLIC_ENDPOINT:http://localhost:4566}
