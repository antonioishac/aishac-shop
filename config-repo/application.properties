# Comum a todos os serviços e perfis.

spring.threads.virtual.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Erros em ProblemDetail (RFC 9457), sem vazar detalhes internos.
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never

# Logs JSON (ECS) em todos os perfis; o ID de correlação vem do MDC.
logging.structured.format.console=ecs

# Versionamento de API nativo do Spring 7: a versão é o segundo segmento do caminho (/api/v1/...).
spring.mvc.apiversion.use.path-segment=1
spring.mvc.apiversion.supported=1

# Actuator: probes de liveness/readiness para Compose e Kubernetes.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true

# Persistência (vale para serviços com banco).
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# OpenAPI (springdoc): contrato em /v3/api-docs.
springdoc.api-docs.path=/v3/api-docs
